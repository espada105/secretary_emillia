[project]
name = "secretary-emillia"
version = "0.1.0"
description = "Local personal assistant with a Korean TTS test interface"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "eunjeon==0.4.0",
  "fastapi>=0.115,<1",
  "melotts @ git+https://github.com/myshell-ai/MeloTTS.git",
  "pydantic-settings>=2.6,<3",
  "python-mecab-ko>=1.3,<2",
  "setuptools<81",
  "torch==2.5.1+cpu",
  "torchaudio==2.5.1+cpu",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
